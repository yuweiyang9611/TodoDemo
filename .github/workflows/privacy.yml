name: Privacy guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  email-privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject non-noreply commit metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            revisions="$BASE_SHA..$HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero" ]]; then
            revisions="$BEFORE_SHA..$HEAD_SHA"
          else
            revisions="$HEAD_SHA"
          fi

          failed=0
          while read -r commit; do
            for email in "$(git show -s --format=%ae "$commit")" "$(git show -s --format=%ce "$commit")"; do
              case "$email" in
                noreply@github.com|*@users.noreply.github.com) ;;
                *)
                  echo "::error::Commit $commit contains a non-noreply author or committer email (value redacted)."
                  failed=1
                  ;;
              esac
            done
          done < <(git rev-list "$revisions")

          exit "$failed"
